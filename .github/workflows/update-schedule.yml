name: Uppdatera schema

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "schedule/scripts/**"
      - ".github/workflows/update-schedule.yml"

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install -r schedule/scripts/requirements.txt

      - name: Generera schedule.json
        run: python3 schedule/scripts/generate_schedule.py --weeks-ahead 1

      - name: Committa om något ändrats
        run: |
          if git diff --quiet -- schedule/data/schedule.json; then
            echo "Inga ändringar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule/data/schedule.json
          git commit -m "Uppdatera schema ($(date -u +%Y-%m-%d))"
          git push
